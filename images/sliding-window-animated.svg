<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><rect width="900" height="260" rx="24" fill="#0d1117"/><text x="40" y="48" fill="#fff" font-size="28" font-family="Arial" font-weight="700">Sliding Window — expand, then shrink</text><g font-family="Arial" font-size="22" text-anchor="middle"><g fill="#21262d" stroke="#8b949e"><rect x="70" y="100" width="95" height="65"/><rect x="165" y="100" width="95" height="65"/><rect x="260" y="100" width="95" height="65"/><rect x="355" y="100" width="95" height="65"/><rect x="450" y="100" width="95" height="65"/><rect x="545" y="100" width="95" height="65"/><rect x="640" y="100" width="95" height="65"/></g><g fill="#fff"><text x="117" y="141">A</text><text x="212" y="141">B</text><text x="307" y="141">C</text><text x="402" y="141">D</text><text x="497" y="141">E</text><text x="592" y="141">F</text><text x="687" y="141">G</text></g><rect x="70" y="100" width="285" height="65" rx="10" fill="none" stroke="#58a6ff" stroke-width="6"><animate attributeName="x" values="70;165;260;355;450" dur="4s" repeatCount="indefinite"/></rect><circle cx="70" cy="182" r="8" fill="#f78166"><animate attributeName="cx" values="70;165;260;355;450" dur="4s" repeatCount="indefinite"/></circle></g><text x="450" y="225" fill="#8b949e" font-size="18" text-anchor="middle" font-family="Arial">maintain a valid range instead of restarting from scratch</text></svg>