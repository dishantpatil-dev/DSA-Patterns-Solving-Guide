<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><rect width="900" height="260" rx="24" fill="#0d1117"/><text x="40" y="48" fill="#fff" font-size="28" font-family="Arial" font-weight="700">Hashing — store information for fast lookup</text><g font-family="Arial"><g fill="#21262d" stroke="#8b949e"><rect x="90" y="90" width="190" height="55" rx="10"/><rect x="355" y="90" width="190" height="55" rx="10"/><rect x="620" y="90" width="190" height="55" rx="10"/></g><text x="185" y="126" fill="#fff" font-size="20" text-anchor="middle">key: apple</text><text x="450" y="126" fill="#fff" font-size="20" text-anchor="middle">key: banana</text><text x="715" y="126" fill="#fff" font-size="20" text-anchor="middle">key: mango</text><text x="185" y="190" fill="#8b949e" font-size="18" text-anchor="middle">count = 3</text><text x="450" y="190" fill="#8b949e" font-size="18" text-anchor="middle">count = 2</text><text x="715" y="190" fill="#8b949e" font-size="18" text-anchor="middle">count = 1</text><circle cx="450" cy="65" r="10" fill="#58a6ff"><animate attributeName="cx" values="185;450;715;185" dur="3s" repeatCount="indefinite"/></circle></g><text x="450" y="235" fill="#8b949e" font-size="18" text-anchor="middle" font-family="Arial">frequency • membership • complement lookup</text></svg>